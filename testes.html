<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes da US01 · Oficina Prime</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .teste { display: flex; gap: 12px; align-items: baseline; padding: 9px 14px; border-bottom: 1px solid var(--borda); }
    .teste:last-child { border-bottom: 0; }
    .teste code { color: var(--suave); font-size: 13px; }
    .res { font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 999px; min-width: 64px; text-align: center; }
    .passou { background: var(--ok-fundo); color: var(--ok-texto); }
    .falhou { background: var(--erro-fundo); color: var(--erro-texto); }
    .resumo { font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="cabecalho">
      <div>
        <h1>Testes de aceitação — US01</h1>
        <p class="sub">Cada caso de teste roda sobre uma cópia dos dados de exemplo (não altera os dados da demonstração).</p>
      </div>
      <div class="contador resumo" id="resumo"></div>
    </div>
    <div class="tabela-wrap" id="lista"></div>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/testes.js"></script>
</body>
</html>
